hooks:
  pre_build:
  - cmd:
    - python3
    - util/check_tool_requirements.py
    env:
      FILES_ROOT: ../src/lowrisc_tool_check_tool_requirements_0.1
    name: check_tool_requirements
name: openhwgroup_cve2_cve2_top_0.1
parameters:
  MHPMCounterNum:
    datatype: int
    default: 10
    paramtype: vlogparam
  MHPMCounterWidth:
    datatype: int
    default: 40
    paramtype: vlogparam
  RV32E:
    datatype: int
    default: 0
    paramtype: vlogparam
  RV32M:
    datatype: str
    default: cve2_pkg::RV32MFast
    description: RV32M implementation parameter enum. See the cve2_pkg::rv32m_e enum
      in cve2_pkg.sv for permitted values.
    paramtype: vlogdefine
  RVFI:
    datatype: bool
    default: true
    paramtype: vlogdefine
  SYNTHESIS:
    datatype: bool
    default: true
    paramtype: vlogdefine
tool_options:
  verilator:
    mode: lint-only
    verilator_options:
    - --unroll-count 72
    - -Wno-COMBDLY
    - -Wno-WIDTHEXPAND
    - -Wno-WIDTHTRUNC
toplevel: cve2_top
version: 0.2.1
vpi: []
